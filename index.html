<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WinterAI | Intelligent Neural Interface</title>
    <meta name="description" content="WinterAI — a fast, free AI assistant powered by Gemini. Beautiful dark interface with streaming responses." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❄️</text></svg>">

    <!-- Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <!-- Google Fonts: Outfit (headings) + Inter (body) + JetBrains Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
      /* ── Design Tokens ───────────────────────────────────────── */
      :root {
        --bg:        #07080f;
        --bg-2:      #0d0f1a;
        --bg-3:      #13162a;
        --border:    rgba(99, 120, 255, 0.12);
        --border-h:  rgba(99, 120, 255, 0.30);
        --text:      #e8eaf6;
        --text-muted:#6b7280;
        --accent:    #6366f1;
        --accent-h:  #818cf8;
        --accent-2:  #06b6d4;
        --user-bg:   #6366f1;
        --ai-bg:     #111827;
        --glow:      rgba(99, 102, 241, 0.18);
      }

      /* ── Base ────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }

      html { height: 100%; }

      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      #root { height: 100%; }

      /* ── Noise texture overlay ───────────────────────────────── */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 0;
      }

      /* ── Utility classes ─────────────────────────────────────── */
      .bg-app    { background: var(--bg); }
      .bg-app-2  { background: var(--bg-2); }
      .bg-app-3  { background: var(--bg-3); }

      /* ── Glassmorphism cards ─────────────────────────────────── */
      .glass {
        background: rgba(13, 15, 26, 0.70);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
      }

      .glass-strong {
        background: rgba(13, 15, 26, 0.90);
        backdrop-filter: blur(32px);
        -webkit-backdrop-filter: blur(32px);
        border: 1px solid var(--border);
      }

      /* ── Glow blob background ────────────────────────────────── */
      .glow-blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        pointer-events: none;
        z-index: 0;
      }
      .glow-1 {
        width: 600px; height: 600px;
        top: -200px; left: -100px;
        background: radial-gradient(circle, rgba(99,102,241,0.10) 0%, transparent 70%);
      }
      .glow-2 {
        width: 400px; height: 400px;
        bottom: -100px; right: -80px;
        background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 70%);
      }

      /* ── Gradient text ───────────────────────────────────────── */
      .grad-text {
        background: linear-gradient(135deg, #818cf8 0%, #06b6d4 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: #818cf8; /* fallback */
      }

      /* ── Scrollbar ───────────────────────────────────────────── */
      .scrollbar::-webkit-scrollbar { width: 4px; }
      .scrollbar::-webkit-scrollbar-track { background: transparent; }
      .scrollbar::-webkit-scrollbar-thumb {
        background: rgba(99,102,241,0.15);
        border-radius: 99px;
      }
      .scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(99,102,241,0.35);
      }

      /* ── Sidebar ─────────────────────────────────────────────── */
      .sidebar {
        width: 260px;
        flex-shrink: 0;
        background: rgba(10,11,20,0.85);
        border-right: 1px solid var(--border);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        display: flex;
        flex-direction: column;
        transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      }

      /* ── Chat bubbles ────────────────────────────────────────── */
      .bubble-user {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
        color: #fff;
        border-radius: 20px 20px 4px 20px;
        box-shadow: 0 4px 24px rgba(99,102,241,0.25);
      }
      .bubble-ai {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 20px 20px 20px 4px;
      }

      /* ── Input box ───────────────────────────────────────────── */
      .input-box {
        background: rgba(17,24,39,0.8);
        border: 1.5px solid var(--border);
        border-radius: 16px;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .input-box:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
      }

      /* ── Send button ─────────────────────────────────────────── */
      .send-btn {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        border-radius: 12px;
        transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
        box-shadow: 0 4px 16px rgba(99,102,241,0.35);
      }
      .send-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 6px 24px rgba(99,102,241,0.45);
      }
      .send-btn:active:not(:disabled) { transform: scale(0.96); }
      .send-btn:disabled { opacity: 0.3; box-shadow: none; }

      /* ── Avatar ──────────────────────────────────────────────── */
      .avatar-ai {
        background: linear-gradient(135deg, #1e1f3a 0%, #1a2035 100%);
        border: 1px solid var(--border);
      }
      .avatar-user {
        background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      }

      /* ── Animations ──────────────────────────────────────────── */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 0.4; transform: scale(0.8); }
        50%       { opacity: 1;   transform: scale(1.2); }
      }
      @keyframes shimmer {
        from { background-position: -200% center; }
        to   { background-position:  200% center; }
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .fade-up { animation: fadeUp 0.4s cubic-bezier(.4,0,.2,1) both; }

      .typing-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: var(--accent-h);
        animation: pulse-dot 1.2s ease-in-out infinite;
        display: inline-block;
      }
      .typing-dot:nth-child(2) { animation-delay: 0.2s; }
      .typing-dot:nth-child(3) { animation-delay: 0.4s; }

      .spinner {
        width: 40px; height: 40px;
        border: 3px solid rgba(99,102,241,0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      /* ── Sidebar nav item ────────────────────────────────────── */
      .nav-item {
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
        border: 1px solid transparent;
      }
      .nav-item.active, .nav-item:hover {
        background: rgba(99,102,241,0.10);
        color: var(--text);
        border-color: var(--border);
      }

      /* ── Clear button ────────────────────────────────────────── */
      .clear-btn {
        font-size: 12px;
        color: var(--text-muted);
        padding: 9px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        text-align: center;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
      }
      .clear-btn:hover {
        background: rgba(239,68,68,0.08);
        border-color: rgba(239,68,68,0.25);
        color: #f87171;
      }

      /* ── Mobile menu overlay ─────────────────────────────────── */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        z-index: 40;
      }

      /* ── Code block ──────────────────────────────────────────── */
      pre {
        font-family: 'JetBrains Mono', monospace !important;
        background: rgba(0,0,0,0.4) !important;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px 16px;
        overflow-x: auto;
        font-size: 13px;
        margin: 10px 0;
      }
      code {
        font-family: 'JetBrains Mono', monospace !important;
        font-size: 0.875em;
        background: rgba(99,102,241,0.12);
        padding: 2px 6px;
        border-radius: 5px;
      }
      pre code { background: transparent; padding: 0; }

      /* ── Markdown prose ──────────────────────────────────────── */
      .prose p  { margin: 0.5em 0; line-height: 1.7; }
      .prose h1, .prose h2, .prose h3 { font-family: 'Outfit', sans-serif; font-weight: 700; margin: 1em 0 0.4em; }
      .prose h1 { font-size: 1.4em; }
      .prose h2 { font-size: 1.2em; }
      .prose h3 { font-size: 1.05em; }
      .prose ul { list-style: disc; padding-left: 1.4em; margin: 0.5em 0; }
      .prose ol { list-style: decimal; padding-left: 1.4em; margin: 0.5em 0; }
      .prose li { margin: 0.25em 0; line-height: 1.65; }
      .prose strong { color: #c7d2fe; font-weight: 600; }
      .prose em { color: #a5b4fc; }
      .prose a  { color: var(--accent-h); text-decoration: underline; }

      /* ── Responsive sidebar ──────────────────────────────────── */
      @media (max-width: 768px) {
        .sidebar {
          position: fixed;
          inset-y: 0;
          left: 0;
          z-index: 50;
          width: 280px;
        }
        .sidebar.closed { transform: translateX(-100%); }
        .sidebar.open   { transform: translateX(0); }
      }
      @media (min-width: 769px) {
        .sidebar { position: relative; transform: none !important; }
        .overlay { display: none !important; }
      }

      /* ── Safe area (iPhone notch) ────────────────────────────── */
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react/":      "https://esm.sh/react@^19.2.3/",
        "react":       "https://esm.sh/react@^19.2.3",
        "react-dom/":  "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
      }
    }
    </script>
    <script type="module" src="./index.tsx"></script>
  </head>
  <body>
    <div class="glow-blob glow-1"></div>
    <div class="glow-blob glow-2"></div>
    <div id="root"></div>
  </body>
</html>
